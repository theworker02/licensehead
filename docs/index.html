<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>licensehead 1.00</title>
  <link rel="stylesheet" href="styles.css">

<body>
  <header>
    <div class="wrap brand">
      <img src="logo.svg" alt="licensehead mark">
      <div>
        <h1>licensehead</h1>
        <p class="tag">SPDX header scanner · version 1.00</p>

  <main class="wrap">
    <section class="card">
      <h2>Purpose</h2>
      <p>Scan .js and .ts files for SPDX-License-Identifier and report files that are missing a header.</p>
      <h2>Install</h2>
      <pre><code>npm install -g licensehead</code></pre>
      <h2>Usage</h2>
      <pre><code>licensehead [dir]</code></pre>
